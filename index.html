<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <img src="icons/icon-192.png" alt="" class="gate-icon">
    <h1>ConspiraCat</h1>
    <p>This is a private app. Enter your access code to unlock it.</p>
    <form id="gateForm" autocomplete="off">
      <label for="gateCode" class="sr">Access code</label>
      <input id="gateCode" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ACCESS CODE" required>
      <button type="submit" class="btn btn-primary" id="gateBtn">Unlock</button>
    </form>
    <p id="gateMsg" class="gate-msg" role="status"></p>
  </div>
</div>

<div id="boot" class="boot"><div class="spinner" aria-label="Loading"></div></div>

<div id="app" class="app" hidden></div>

<script src="loader.js"></script>
