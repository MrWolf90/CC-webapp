name: Publish ConspiraCat website

# Runs every time you upload a new ConspiraCat-website.zip (or by hand from the Actions tab).
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the uploaded zip
        uses: actions/checkout@v4

      - name: Unzip and check the website
        run: |
          if [ ! -f ConspiraCat-website.zip ]; then
            echo "::error::ConspiraCat-website.zip was not found in the repository"
            exit 1
          fi
          unzip -q -o ConspiraCat-website.zip -d unpacked
          DIR="$(dirname "$(find unpacked -maxdepth 3 -name index.html | head -n 1)")"
          for f in index.html loader.js app.enc style.css sw.js qr-worker.js manifest.webmanifest lib/jsQR.js icons/icon-192.png; do
            if [ ! -f "$DIR/$f" ]; then
              echo "::error::$f is missing inside ConspiraCat-website.zip"
              exit 1
            fi
          done
          mkdir site
          cp -r "$DIR"/. site/
          touch site/.nojekyll
          ls -la site

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
